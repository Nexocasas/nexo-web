# Mantiene activos los proyectos de Supabase (el plan gratuito los pausa tras ~1 semana sin uso).
# Todos los días hace consultas mínimas de solo lectura a cada proyecto. No modifica ningún dato.
# Si una falla, reintenta varias veces antes de dar error (el proyecto puede estar arrancando).
# Se puede ejecutar a mano desde la pestaña "Actions" → "Supabase keep-alive" → "Run workflow".
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 12 * * *"     # todos los días, 09:17 hora Argentina
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Tu casa Nexo (panel y formulario de clientes)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 -X POST \
              "https://chplkjzxfqktftcefwsp.supabase.co/rest/v1/rpc/cliente_get" \
              -H "apikey: sb_publishable_v7pYtkEAR0bprUIw1QWiCw_GFdx0Tid" \
              -H "Content-Type: application/json" \
              -d '{"p_token":"keepalive-ping"}' || echo 000)
            echo "Tu casa Nexo (intento $i) → HTTP $code"
            [ "$code" = "200" ] && break
            sleep 60
          done
          curl -sS -o /dev/null --retry 3 \
            "https://chplkjzxfqktftcefwsp.supabase.co/rest/v1/clientes?select=id&limit=1" \
            -H "apikey: sb_publishable_v7pYtkEAR0bprUIw1QWiCw_GFdx0Tid" || true
          test "$code" = "200"

      - name: Nexo-compras
        if: always()
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 \
              "https://zjawwmwcjfttvcpchamn.supabase.co/rest/v1/pedidos?select=*&limit=1" \
              -H "apikey: sb_publishable_yVbME2WNEMfldYGkLrN00g_sa625rdi" || echo 000)
            echo "Nexo-compras (intento $i) → HTTP $code"
            [ "$code" = "200" ] && break
            sleep 60
          done
          test "$code" = "200"
