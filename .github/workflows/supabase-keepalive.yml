# Mantiene activos los proyectos de Supabase (el plan gratuito los pausa tras ~1 semana sin uso).
# Cada 3 días hace una consulta mínima de solo lectura a cada proyecto. No modifica ningún dato.
# Se puede ejecutar a mano desde la pestaña "Actions" → "Supabase keep-alive" → "Run workflow".
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 12 */3 * *"   # cada 3 días, 09:17 hora Argentina
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Tu casa Nexo (panel y formulario de clientes)
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            "https://chplkjzxfqktftcefwsp.supabase.co/rest/v1/rpc/cliente_get" \
            -H "apikey: sb_publishable_v7pYtkEAR0bprUIw1QWiCw_GFdx0Tid" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"keepalive-ping"}')
          echo "Tu casa Nexo → HTTP $code"
          test "$code" = "200"

      - name: Nexo-compras
        if: always()
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://zjawwmwcjfttvcpchamn.supabase.co/rest/v1/pedidos?select=*&limit=0" \
            -H "apikey: sb_publishable_yVbME2WNEMfldYGkLrN00g_sa625rdi")
          echo "Nexo-compras → HTTP $code"
          test "$code" = "200"
